<div class="q-block">
<div class="q-header">

<h2>1. Kubernetes Architecture Overview</h2>
<p>Kubernetes uses a master-worker client-server architecture. The cluster consists of a centralized <strong>Control Plane</strong> (the brain) and multiple <strong>Worker Nodes</strong> (execution engines where applications run).</p>

<div class="diagram-box">

          </div>
        </div>
      </div>

        <div class="arch-layer worker" style="min-width:auto;">

            <div class="arch-sub"><strong>kubelet</strong>Node agent</div>

            <div class="arch-sub"><strong>Pods</strong>Running containers</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<h3>A. Control Plane Components (Master Node)</h3>
<ul>
  <li><strong><code>kube-apiserver</code>:</strong> The front-end management gateway exposing cluster endpoints for <code>kubectl</code> commands and administrative API requests.</li>
  <li><strong><code>etcd</code>:</strong> A highly available, distributed key-value store holding the complete cluster state, configuration, and secrets.</li>
  <li><strong><code>kube-scheduler</code>:</strong> Evaluates resource requirements and assigns unscheduled Pods onto optimal worker nodes.</li>
  <li><strong><code>kube-controller-manager</code>:</strong> Runs background control loops (Node Controller, ReplicaSet Controller) to regulate the cluster toward its desired state.</li>
</ul>

<h3>B. Worker Node Components</h3>
<ul>
  <li><strong><code>kubelet</code>:</strong> The primary node agent ensuring that assigned Pods and containers are healthy and running.</li>
  <li><strong><code>kube-proxy</code>:</strong> Manages network routing rules, <code>iptables</code>/<code>IPVS</code>, and load balancing for Services running on the node.</li>
  <li><strong>Container Runtime:</strong> Software responsible for executing containers (e.g., <code>containerd</code>, CRI-O, Docker).</li>
</ul>

<h2>2. The Kubernetes Flat Networking Model</h2>
<p>Kubernetes enforces a strict, non-NAT, flat networking model across the entire cluster:</p>
<ul>
  <li><strong>Unique IP per Pod:</strong> Every Pod receives a unique, routable IP address within the cluster.</li>
  <li><strong>Direct Pod-to-Pod Communication:</strong> Any Pod can communicate directly with any other Pod across any node without Network Address Translation (NAT).</li>
  <li><strong>Container Network Interface (CNI):</strong> Implemented via network overlay plugins like <strong>Calico</strong>, <strong>Flannel</strong>, or <strong>Cilium</strong>.</li>
</ul>

<div class="q-header">

<h2>1. Application Scaling in Kubernetes</h2>
<p>Containers are ephemeral and stateless by default. Kubernetes supports distinct scaling dimensions:</p>

<table>
  <tr><th>Scaling Type</th><th>What It Adjusts</th><th>Based On</th></tr>
  <tr>

  </tr>
  <tr>
    <td><strong>Cluster Autoscaler</strong></td>
    <td>Automatically adds or removes underlying <strong>worker nodes</strong></td>
    <td>Pending pods that cannot be scheduled due to hardware resource exhaustion</td>
  </tr>
</table>

<h2>2. Persistent Storage Management in Kubernetes</h2>
<p>Because container filesystems are wiped when a Pod restarts, Kubernetes decouples data persistence from compute lifecycles using storage abstractions:</p>

<div class="diagram-box">

      <div class="al-name">PersistentVolume (PV)</div>

  </div>
</div>

<ul>

  <li><strong>Persistent Volume Claim (PVC):</strong> A developer's declarative request for storage specifying capacity (e.g., <code>50Gi</code>) and access mode (<code>ReadWriteOnce</code>, <code>ReadWriteMany</code>). Kubernetes automatically binds matching PVs to PVCs.</li>
  <li><strong>StatefulSets:</strong> A specialized workload controller designed for databases (MySQL, MongoDB) requiring <strong>stable network identifiers</strong> (e.g., <code>mysql-0</code>, <code>mysql-1</code>) and dedicated persistent storage bindings that survive Pod rescheduling.</li>
</ul>

<div class="note">
  <strong>Reference:</strong> Kubernetes.pdf, Slides 23–33.
</div>
</div>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Question 3 · 8M | CO-3, BL-3</div>
  <div class="q-title">Explain Docker Architecture and Volume Management with Commands.</div>

<h2>1. Docker Client-Server Architecture</h2>
<p>Docker uses a client-server architecture where the <strong>Docker Client</strong> (<code>docker</code> CLI) communicates with the background <strong>Docker Daemon</strong> (<code>dockerd</code>) via REST APIs to build, run, and manage container workloads.</p>

<div class="diagram-box">
  <div class="diagram-title">Docker Client-Server Architecture</div>
  <div class="arch-stack">
    <div class="arch-layer control">
      <div class="al-name">DOCKER CLIENT (CLI)</div>
      <div class="al-desc">docker build, docker run, docker pull — user-facing commands</div>
    </div>
    <div class="arch-arrow">↓ REST API over Unix socket</div>
    <div class="arch-layer devops">
      <div class="al-name">DOCKER DAEMON (dockerd)</div>
      <div class="al-desc">Background service that manages images, containers, networks, volumes</div>
    </div>
    <div class="arch-arrow">↓ Pulls/pushes images from</div>
    <div class="arch-layer worker">
      <div class="al-name">DOCKER REGISTRY / HUB</div>
      <div class="al-desc">Centralized repository — Docker Hub, AWS ECR, private registries</div>
    </div>
  </div>
</div>

<ul>
  <li><strong>Docker Host:</strong> The physical or virtual machine running the Docker engine.</li>
  <li><strong>Docker Registry / Hub:</strong> A centralized repository for storing and distributing container images (e.g., Docker Hub, AWS ECR).</li>
  <li><strong>Docker Images vs. Containers:</strong> An <strong>Image</strong> is a read-only immutable static blueprint, while a <strong>Container</strong> is a runnable, isolated active process instance created from an image.</li>
</ul>

<h2>2. Docker Volume Management</h2>
<p>Docker volumes persist container data independently of the container lifecycle:</p>
<ul>
  <li><strong>Named Volumes:</strong> Managed safely inside <code>/var/lib/docker/volumes/</code> on Linux hosts.</li>
</ul>

<div class="code-block">

  <pre><span style="color:#8b949e"># 1. Create a named persistent volume</span>
$ docker volume create db-data

<span style="color:#8b949e"># 2. List all available volumes</span>
$ docker volume ls

<span style="color:#8b949e"># 3. Mount volume to a MySQL container</span>
$ docker run -d --name mydb -v db-data:/var/lib/mysql -e MYSQL_ROOT_PASSWORD=secret mysql:8.0

<span style="color:#8b949e"># 4. Inspect volume details</span>
$ docker volume inspect db-data

<span style="color:#8b949e"># 5. Remove an unused volume</span>
$ docker volume rm db-data</pre>
</div>

<div class="note">
  <strong>Reference:</strong> Docker.pdf, Slides 15, 16, 27–29.

<div class="q-block">
<div class="q-header">
  <div class="q-num">Question 4 · 8M | CO-3, BL-4</div>
  <div class="q-title">Compare Git with Centralized VCS and explain GitHub collaboration features.</div>
  <div class="q-marks">8M</div>
</div>

<h2>1. Git (Distributed VCS) vs. Centralized VCS (e.g., SVN)</h2>

<table>
  <tr><th>Feature</th><th>Centralized VCS (e.g., SVN)</th><th>Distributed VCS (Git)</th></tr>
  <tr>
    <td><strong>Repository Storage</strong></td>
    <td>Single central server contains full history. Clients download working copies only.</td>
    <td>Every client clones the complete repository history, branches, and tags locally.</td>
  </tr>
  <tr>
    <td><strong>Offline Operations</strong></td>
    <td>Cannot commit, branch, or view history without network connection to the server.</td>
    <td>All operations (commit, diff, log, branch, merge) execute instantly offline.</td>
  </tr>
  <tr>
    <td><strong>Single Point of Failure</strong></td>
    <td>High risk: If the central server crashes or corrupts, history is lost.</td>
    <td>Zero risk: Every developer workstation serves as a full redundant backup.</td>
  </tr>
</table>

<h2>2. GitHub Collaboration Features</h2>
<p>GitHub extends Git by providing structured quality gates for team collaboration:</p>

<ul>
  <li><strong>Branching Workflow:</strong> Developers isolate changes on dedicated feature branches (e.g., <code>git checkout -b feature-payment</code>).</li>
  <li><strong>Pull Requests (PRs):</strong> Proposes changes to main branches, triggering automated CI checks (Jenkins/GitHub Actions) to validate code quality.</li>
  <li><strong>Inline Code Reviews:</strong> Reviewers inspect unified diffs, leave line-by-line comments, and enforce <strong>Branch Protection Rules</strong> requiring approval before merging.</li>
</ul>

<div class="note">
  <strong>Reference:</strong> GIT and GITHUB.pdf, Slides 2–5, 18–25.
</div>
</div>

          content: `
<div class="q-block">
<div class="q-header">
  <div class="q-num">Question 1 · 8M / 10M | CO-4, BL-2</div>
  <div class="q-title">Describe Jenkins Overview, Including Pipelines, Build Dependencies, Plugins, and Triggers, with a Declarative Example.</div>
  <div class="q-marks">8M / 10M</div>
</div>

<h2>1. Jenkins Overview & Architecture</h2>
<p><strong>Jenkins</strong> is an open-source, Java-based automation server used globally to build, test, and deploy applications, serving as the backbone of continuous integration and continuous delivery (CI/CD) workflows.</p>

<h2>2. Core Components of Jenkins</h2>

<h3>A. Jenkins Pipelines</h3>
<p>A pipeline is a suite of plugins that implements CI/CD workflows as code via a version-controlled file called a <code>Jenkinsfile</code>. Supports <strong>Declarative Pipelines</strong> (structured syntax using <code>pipeline</code>, <code>agent</code>, <code>stages</code>, <code>steps</code>) and <strong>Scripted Pipelines</strong> (Groovy-based).</p>

<h3>B. Build Dependencies</h3>
<p>Jenkins manages runtime toolchains across languages (Java/Maven, Node.js/npm, Python/pip) using global tool configurations, environment variables, or dynamic Docker agents.</p>

<h3>C. Jenkins Plugins</h3>
<p>Plugins extend functionality (over 1,800+ available). Key plugins include: <strong>Git Plugin</strong> (for SCM checkout), <strong>Pipeline Plugin</strong>, <strong>Docker Plugin</strong>, <strong>JUnit Plugin</strong> (for test reporting), and <strong>Credentials Plugin</strong>.</p>

<h3>D. Pipeline Triggers</h3>
<p>Define when a pipeline executes: <strong>SCM Triggers</strong> (Git polling), <strong>Webhooks</strong> (instant notifications from GitHub/GitLab on commit), <strong>Cron-based Scheduling</strong> (e.g., nightly builds at 2 AM), <strong>Manual Triggers</strong>, and <strong>Upstream/Downstream Builds</strong>.</p>

<h2>3. Example Declarative Jenkins Pipeline</h2>

<div class="code-block">
  <span class="code-label">Jenkinsfile</span>
  <pre>pipeline {
    agent any
    stages {
        stage('Checkout') {
            steps {
                git branch: 'main', url: 'https://github.com/vnrorg/api-app.git'
            }
        }
        stage('Build') {
            steps {
                sh 'mvn clean install'
            }
        }
        stage('Test') {
            steps {
                sh 'mvn test'
            }
        }
        stage('Deploy') {
            steps {
                sh './deploy-staging.sh'
            }
        }
    }
}</pre>
</div>

<div class="diagram-box">
  <div class="diagram-title">Jenkins Pipeline Flow</div>
  <div class="pipeline-flow">
    <div class="pipe-stage cyan"><strong>Git Commit / Webhook</strong><br>Developer pushes code to GitHub</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage"><strong>Checkout</strong><br>Jenkins pulls source from SCM</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage"><strong>Build</strong><br>mvn clean install / npm build</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage purple"><strong>Test</strong><br>Unit tests, integration tests, SonarQube scan</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage"><strong>Deploy</strong><br>Deploy to staging / production</div>
  </div>
</div>

<div class="note">
  <strong>Reference:</strong> Unit 4 Devops.pdf, Slides 2–11.
</div>
</div>

<h2>1. Importance of Automated Testing in DevOps</h2>
<p>Automated testing verifies code changes rapidly, consistently, and without manual intervention, acting as a core pillar of CI/CD pipelines.</p>
<ul>
  <li><strong>Faster Feedback:</strong> Tests run automatically after every code commit, notifying developers instantly.</li>
  <li><strong>Early Bug Detection:</strong> Catching bugs early drastically reduces debugging time and production failure costs.</li>
  <li><strong>Higher Accuracy:</strong> Eliminates human oversight and guarantees repeatable test executions.</li>
</ul>

<h2>2. Types of Testing Layers</h2>

<div class="diagram-box">
  <div class="diagram-title">Testing Pyramid</div>
  <div class="arch-stack">
    <div class="arch-layer" style="min-width:200px; border-color:var(--orange); background:var(--orange-soft);">
      <div class="al-name" style="color:var(--orange);">E2E Testing</div>

    <div class="arch-arrow">↓</div>
    <div class="arch-layer" style="min-width:300px;">

      <div class="al-desc">Module interaction, API contracts, database</div>
    </div>
    <div class="arch-arrow">↓</div>
    <div class="arch-layer control" style="min-width:400px;">
      <div class="al-name">Unit Testing (Largest Layer)</div>
      <div class="al-desc">JUnit (Java), pytest (Python) — individual methods in isolation</div>
    </div>
  </div>
</div>

<h2>3. Test-Driven Development (TDD) & The Red-Green-Refactor Cycle</h2>
<p>TDD is a software development methodology where automated tests are written <em>before</em> production code:</p>
<ol>
  <li><strong>Red Phase:</strong> Write a failing automated test for a new feature. The failure confirms the test is valid.</li>
  <li><strong>Green Phase:</strong> Write the minimum amount of production code required to make the test pass.</li>
  <li><strong>Refactor Phase:</strong> Clean up and optimize the code structure while ensuring all tests stay green.</li>
</ol>

<h2>4. API Testing Using Postman</h2>
<p>APIs act as the architectural backbone of microservices. <strong>Postman</strong> is widely used for functional, positive/negative, authentication, and performance testing of REST endpoints.</p>

});</pre>
</div>

    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage purple"><strong>3. terraform plan</strong><br>Dry-run: preview additions (+), modifications (~), destructions (-)</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage"><strong>4. terraform apply</strong><br>Execute real cloud API calls to provision infrastructure</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage cyan"><strong>5. terraform destroy</strong><br>Safely tear down all provisioned resources</div>
  </div>
</div>

<ol>
  <li><strong>Write:</strong> Developers author declarative infrastructure definitions in <code>.tf</code> HCL files.</li>
  <li><strong><code>terraform init</code>:</strong> Initializes the working directory, downloads required cloud provider plugins, and configures remote backends.</li>
  <li><strong><code>terraform plan</code>:</strong> Executes a dry-run analysis, generating an execution plan previewing additions (<code>+</code>), modifications (<code>~</code>), and destructions (<code>-</code>).</li>
  <li><strong><code>terraform apply</code>:</strong> Executes real-world cloud API calls to provision infrastructure matching the desired state.</li>
  <li><strong><code>terraform destroy</code>:</strong> Safely tears down and deletes all provisioned cloud resources when decommissioning.</li>
</ol>

<h2>3. Terraform State Management (terraform.tfstate)</h2>
<ul>
  <li><strong>Role:</strong> The <code>terraform.tfstate</code> file serves as the authoritative single source of truth mapping declared HCL code to real-world cloud resource IDs and attributes.</li>
  <li><strong>Importance:</strong> (1) Tracks resource dependency metadata, (2) Accelerates execution performance, (3) Enables <strong>Drift Detection</strong> by comparing cloud reality against desired code, and (4) Facilitates secure team collaboration via <strong>Remote State Locking</strong> (e.g., AWS S3 with DynamoDB locking) to prevent race conditions.</li>
</ul>

<div class="note">
  <strong>Reference:</strong> IaC and Terraform.pdf, Slides 4, 12, 13; Terraform.pdf, Slides 6, 17, 25.

<div class="q-block">
<div class="q-header">
  <div class="q-num">Question 2 · 8M / 10M | CO-5, BL-3</div>
  <div class="q-title">Explain the End-to-End GitOps Workflow Using ArgoCD and Kubernetes.</div>
  <div class="q-marks">8M / 10M</div>
</div>

<h2>1. Core Principles of GitOps</h2>
<p>GitOps maintains <strong>Git as the single source of truth</strong> for both application and infrastructure state.</p>
<ul>
  <li><strong>Declarative Descriptions:</strong> The entire desired state (Deployments, Services, RBAC) is declared in Git using YAML or Helm charts.</li>
  <li><strong>Automated Reconciliation:</strong> Software agents running inside the cluster continuously pull configurations from Git and reconcile the live environment.</li>
</ul>

<h2>2. ArgoCD Reconciliation Architecture & Workflow</h2>

<div class="diagram-box">
  <div class="diagram-title">ArgoCD GitOps Reconciliation Workflow</div>
  <div class="pipeline-flow">
    <div class="pipe-stage cyan"><strong>1. Developer Commit</strong><br>Push updated K8s manifests / Helm charts to GitHub</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage"><strong>2. ArgoCD Repo Server</strong><br>Continuously watches Git repository · Caches &amp; renders manifests</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage purple"><strong>3. Desired vs. Actual Comparison</strong><br>Application Controller compares Git state vs. live cluster state</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage"><strong>4. Automated Synchronization</strong><br>ArgoCD executes internal kubectl apply to deploy workloads</div>
    <div class="pipe-arrow">↓</div>
    <div class="pipe-stage cyan"><strong>5. Drift Correction</strong><br>Manual CLI changes flagged as "Out of Sync" → auto-overridden back to Git</div>
  </div>
</div>

<ol>
  <li><strong>Developer Commit:</strong> A developer pushes updated Kubernetes manifests or Helm charts containing new image tags (e.g., <code>v2.0.0</code>) to GitHub.</li>
  <li><strong>Change Detection:</strong> The <strong>ArgoCD Repo Server</strong> continuously watches the target Git repository, caching and rendering manifests.</li>
  <li><strong>Desired vs. Actual Comparison:</strong> The <strong>ArgoCD Application Controller</strong> compares the desired state declared in Git with the live runtime state of the Kubernetes cluster.</li>
  <li><strong>Automated Synchronization:</strong> ArgoCD triggers an automated sync, executing internal <code>kubectl apply</code> commands to deploy the container workloads.</li>
  <li><strong>Drift Correction:</strong> If an engineer makes manual out-of-band changes via the CLI, ArgoCD flags an <strong>Out of Sync</strong> state and automatically overrides it back to match Git.</li>
</ol>

<div class="note">
  <strong>Reference:</strong> GitOps and ArgoCD.pdf, Slides 2, 6, 9, 10, 19, 21, 22.
</div>
</div>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Question 3 · 8M / 10M | CO-5, BL-2</div>
  <div class="q-title">Explain DevSecOps Practices for Securing Containerized Applications, Including Shift-Left Security, Container Scanning, and Secret Management (Vault).</div>
  <div class="q-marks">8M / 10M</div>
</div>

<h2>1. Shift-Left Security & SAST/SCA</h2>
<p><strong>DevSecOps</strong> embeds security controls seamlessly across every stage of the software delivery lifecycle.</p>
<ul>
  <li><strong>Shift-Left Approach:</strong> Security checks are moved earlier into the coding and build phases rather than occurring post-deployment.</li>
  <li><strong>Static Application Security Testing (SAST):</strong> Tools like <strong>SonarQube</strong> or <strong>CodeQL</strong> analyze source code during pull requests to catch vulnerabilities like SQL injection and insecure patterns.</li>
  <li><strong>Software Composition Analysis (SCA):</strong> Tools like <strong>Snyk</strong> or <strong>OWASP Dependency-Check</strong> audit third-party open-source libraries for known CVEs.</li>
</ul>

<h2>2. Container Image Vulnerability Scanning</h2>
<ul>
  <li><strong>Base Image Hardening:</strong> Use minimal, verified base images (e.g., Alpine Linux, Distroless) to reduce the system attack surface.</li>
  <li><strong>Pipeline Scanning:</strong> Tools like <strong>Trivy</strong> or <strong>Clair</strong> scan container image layers during CI builds, enforcing quality gates that halt pipelines if High/Critical vulnerabilities are found.</li>
</ul>

<h2>3. Secret Management with HashiCorp Vault</h2>
<ul>
  <li><strong>Problem:</strong> Hardcoding plaintext passwords, database credentials, or API tokens in source code and Dockerfiles creates severe security risks.</li>
  <li><strong>Solution:</strong> <strong>HashiCorp Vault</strong> provides a centralized, identity-based secrets manager that encrypts data at rest (AES-256-GCM), enforces fine-grained <strong>RBAC policies</strong> (HCL-based), and generates short-lived <strong>dynamic secrets</strong> with automated lease revocation.</li>
</ul>

<div class="code-block">

  <pre><span style="color:#8b949e"># Enable key-value secrets engine</span>
$ vault secrets enable -path secret kv-v2

<span style="color:#8b949e"># Store a production database credential</span>
$ vault kv put secret/production/db username="db_admin" password="SecurePassword2026"

<span style="color:#8b949e"># Retrieve the credential at runtime</span>
$ vault kv get secret/production/db</pre>
</div>

  </div>
</div>

<div class="note">

let currentUnit = 0;
let currentSection = 0;
let readSections = new Set();

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  courseData.units.forEach((unit, ui) => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn' + (ui === currentUnit ? ' active' : '');
    btn.innerHTML = unit.title + '<span class="ch">▸</span>';
    btn.onclick = () => { currentUnit = ui; currentSection = 0; renderSidebar(); renderContent(); };
    nav.appendChild(btn);
    const list = document.createElement('div');
    list.className = 'sec-list' + (ui === currentUnit ? ' open' : '');
    unit.sections.forEach((sec, si) => {
      const link = document.createElement('a');
      link.className = 'sec-link' + (ui === currentUnit && si === currentSection ? ' active' : '');
      link.textContent = sec.title;
      link.onclick = (e) => { e.preventDefault(); currentUnit = ui; currentSection = si; renderSidebar(); renderContent(); };
      list.appendChild(link);
    });
    nav.appendChild(list);
  });
}

function renderContent() {
  const area = document.getElementById('contentArea');
  const unit = courseData.units[currentUnit];
  const sec = unit.sections[currentSection];
  let html = sec.content;
  const prevDisabled = currentUnit === 0 && currentSection === 0;
  const nextDisabled = currentUnit === courseData.units.length - 1 && currentSection === unit.sections.length - 1;
  let prevTarget = null, nextTarget = null;
  if (!prevDisabled) {
    if (currentSection > 0) prevTarget = [currentUnit, currentSection - 1];
    else prevTarget = [currentUnit - 1, courseData.units[currentUnit - 1].sections.length - 1];
  }
  if (!nextDisabled) {
    if (currentSection < unit.sections.length - 1) nextTarget = [currentUnit, currentSection + 1];
    else nextTarget = [currentUnit + 1, 0];
  }
  html += '<div class="top-nav">';
  html += '<button class="nav-btn" ' + (prevDisabled ? 'disabled' : '') + ' onclick="' + (prevTarget ? 'jumpTo(' + prevTarget[0] + ',' + prevTarget[1] + ')' : '') + '">← Previous</button>';
  html += '<span style="font-size:13px; color:var(--text-tertiary);">' + (currentSection + 1) + ' of ' + unit.sections.length + '</span>';
  html += '<button class="nav-btn" ' + (nextDisabled ? 'disabled' : '') + ' onclick="' + (nextTarget ? 'jumpTo(' + nextTarget[0] + ',' + nextTarget[1] + ')' : '') + '">Next →</button>';
  html += '</div>';
  if (currentSection === unit.sections.length - 1 && flashcardData[currentUnit]) {
    html += '<h2 style="margin-top:40px; font-size:20px;">Quick Review Flashcards</h2>';
    html += '<p style="font-size:13px; color:var(--text-tertiary); margin-bottom:16px;">Click cards to reveal answers</p>';
    flashcardData[currentUnit].forEach(function(card) {
      html += '<div class="flashcard" onclick="this.classList.toggle(\'flipped\')"><div class="fc-q">' + card.q + '</div><div class="fc-a">' + card.a + '</div><div class="fc-hint">Click to flip</div></div>';
    });
  }
  area.innerHTML = html;
  readSections.add(sec.id);
  updateProgress();
  window.scrollTo(0, 0);
}

function updateProgress() {
  const total = courseData.units.reduce(function(a, u) { return a + u.sections.length; }, 0);
  const pct = Math.round((readSections.size / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% complete';
}

function jumpTo(ui, si) {
  currentUnit = ui; currentSection = si;
  renderSidebar(); renderContent();
}

function setupSearch() {
  const box = document.getElementById('searchBox');
  const res = document.getElementById('searchResults');
  box.addEventListener('input', function(e) {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { res.style.display = 'none'; return; }
    const matches = [];
    courseData.units.forEach(function(u, ui) {
      u.sections.forEach(function(s, si) {
        const text = (s.title + ' ' + s.content.replace(/<[^>]+>/g, ' ')).toLowerCase();
        if (text.includes(q)) {
          const rawText = s.content.replace(/<[^>]+>/g, ' ');
          const idx = text.indexOf(q);
          const snippet = rawText.substring(Math.max(0, idx - 30), idx + 60);
          matches.push({ui: ui, si: si, title: s.title, snippet: '...' + snippet + '...'});
        }
      });
    });
    if (!matches.length) { res.innerHTML = '<div class="search-result"><span style="color:var(--text-tertiary)">No results</span></div>'; }
    else {
      res.innerHTML = matches.map(function(m) {
        return '<div class="search-result" onclick="jumpTo(' + m.ui + ',' + m.si + '); document.getElementById(\'searchResults\').style.display=\'none\'; document.getElementById(\'searchBox\').value=\'\';"><div class="sr-title">' + m.title + '</div><div class="sr-snippet">' + m.snippet + '</div></div>';
      }).join('');
    }
    res.style.display = 'block';
  });
  document.addEventListener('click', function(e) {
    if (!box.contains(e.target) && !res.contains(e.target)) res.style.display = 'none';
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

renderSidebar();
renderContent();
setupSearch();
</script>
